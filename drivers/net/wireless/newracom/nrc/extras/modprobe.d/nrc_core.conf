# NRC7394 Modular Driver — nrc_core (HAL) parameters
#
# Copy to /etc/modprobe.d/nrc_core.conf and edit as needed.
# Applied automatically when loading via: sudo modprobe nrc_wlan
#
# When using start_modular.py, this file is auto-generated on each run.
# When NOT using start_modular.py, edit this file directly.
#
# ─────────────────────────────────────────────────────────────────────

# === Parameters (uncomment to enable) ===
#
# Debug: 0=ERR 1=WARN 2=INFO(default) 3=DBG 4=VBS
#   debug_level=2
#   debug_mask=0x201
#
# (no parameters required — nrc_core is configured via nrc_wlan)
#
# ─────────────────────────────────────────────────────────────────────
# Parameter Reference:
#   debug_level   0:ERR 1:WARN 2:INFO 3:DBG 4:VBS (default: 2)
#   debug_mask    Bitmask for debug categories (default: 0x201)
