# NRC7394 Modular Driver — nrc_mcp (MCP Frontend) parameters
#
# Copy to /etc/modprobe.d/nrc_mcp.conf and edit as needed.
# Applied automatically when loading via: sudo modprobe nrc_mcp
#
# When using start_modular.py, this file is auto-generated on each run.
# When NOT using start_modular.py, edit this file directly.
#
# ─────────────────────────────────────────────────────────────────────

# === Default MCP Settings ===
options nrc_mcp \
    mcp_priority=0 \
    bd_name=nrc7394_bd.dat \
    fw_name=uni_s1g.bin

# === Optional Parameters (uncomment to enable) ===
#
# Debug: 0=ERR 1=WARN 2=INFO(default) 3=DBG 4=VBS
#   debug_level=2
#   debug_mask=0x201
#
# ─────────────────────────────────────────────────────────────────────
# Parameter Reference:
#   mcp_priority  0:disabled 1:suspend WLAN TX during MCP (default: 0)
#   bd_name       Board data file in /lib/firmware/ (default: nrc7394_bd.dat)
#   fw_name       Firmware file in /lib/firmware/ (default: uni_s1g.bin)
#   debug_level   0:ERR 1:WARN 2:INFO 3:DBG 4:VBS (default: 2)
#   debug_mask    Bitmask for debug categories (default: 0x201)
