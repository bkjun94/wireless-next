# NRC7394 Modular Driver — nrc_spi (SPI Backend) parameters
#
# Copy to /etc/modprobe.d/nrc_spi.conf and edit as needed.
# Applied automatically when loading via: sudo modprobe nrc_wlan
#
# When using start_modular.py, this file is auto-generated on each run.
# When NOT using start_modular.py, edit this file directly for your setup.
#
# Lines starting with '#' are comments (disabled).
# Remove '#' to enable a parameter.
# ─────────────────────────────────────────────────────────────────────

# === SPI Hardware Settings (REQUIRED — match your board) ===
options nrc_spi \
    hifspeed=20000000 \
    spi_bus_num=0 \
    spi_cs_num=0 \
    spi_gpio_irq=5 \
    spi_polling_interval=0

# === Optional Parameters (uncomment to enable) ===
#
# SPI GDMA IRQ number (default: 6)
#   spi_gdma_irq=6
#
# Enable HSPI initialization (default: false)
#   enable_hspi_init=0
#
# HIF port device name (default: /dev/ttyAMA0 on ARM)
#   hifport=/dev/ttyAMA0
#
# Power save GPIO: host_gpio,target_gpio,active_high
# Auto-configured by start_modular.py based on kernel version.
# Kernel ≥6.6 Flash: 529,14,1 | Kernel ≥6.6 EEPROM: 527,14,1
# Kernel <6.6 Flash: 17,14,1  | Kernel <6.6 EEPROM: 15,12,1
#   power_save_gpio=529,14,1
#
# Debug: 0=ERR 1=WARN 2=INFO(default) 3=DBG 4=VBS
#   debug_level=2
#   debug_mask=0x201
#
# ─────────────────────────────────────────────────────────────────────
# Parameter Reference:
#   hifspeed              SPI clock in Hz (default: 20000000)
#   spi_bus_num           SPI controller bus number (default: 0)
#   spi_cs_num            SPI chip-select number (default: 0)
#   spi_gpio_irq          GPIO for EIRQ interrupt (default: 5, -1=disable)
#   spi_polling_interval  Polling interval ms; 0=interrupt mode (default: 0)
#   spi_gdma_irq          GDMA IRQ number (default: 6)
#   enable_hspi_init      Enable HSPI init (default: false)
#   hifport               HIF port device (default: /dev/ttyAMA0)
#   power_save_gpio       host_gpio,target_gpio,active_high (array of 3)
#   debug_level           0:ERR 1:WARN 2:INFO 3:DBG 4:VBS (default: 2)
#   debug_mask            Bitmask for debug categories (default: 0x201)
