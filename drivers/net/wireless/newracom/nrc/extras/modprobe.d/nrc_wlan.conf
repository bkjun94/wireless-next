# NRC7394 Modular Driver — nrc_wlan (WLAN Frontend) parameters
#
# Copy to /etc/modprobe.d/nrc_wlan.conf and edit as needed.
# Applied automatically when loading via: sudo modprobe nrc_wlan
#
# When using start_modular.py, this file is auto-generated on each run.
# When NOT using start_modular.py, edit this file directly for your setup.
#
# DEFAULT: AP mode configuration (NDP probe enabled, BSS idle management).
# For STA mode, see "Quick Examples" at the bottom of this file.
#
# Lines starting with '#' are comments (disabled).
# Remove '#' to enable a parameter, or add to the 'options' line.
# ─────────────────────────────────────────────────────────────────────

# === Firmware & Board Data + AP Defaults ===
options nrc_wlan \
    fw_name=uni_s1g.bin \
    bd_name=nrc7394_bd.dat \
    ndp_preq=1 \
    bss_max_idle=1800

# === Power Save (STA only — uncomment to enable) ===
#   power_save=0       0:Always-on 2:TIM-DeepSleep 3:nonTIM-DeepSleep
#   sleep_duration=3000,1  Duration for nonTIM mode (ms, unit: 0=ms 1=sec)
#   idle_mode=0        0:disabled 1:enter DeepSleep when idle
#   listen_interval=1000   Listen interval in Beacon Interval units (1-65535)
#   ps_pretend=0       0:disabled 1:pretend PS for no-response STAs (AP)

# === BSS Idle / Connection ===
#   bss_max_idle=1800  BSS max idle period in 1000TU (0=disabled)
#   bss_max_idle_offset=0  Offset for BSS max idle (fine-tuning)
#   beacon_loss_count=20   Beacon loss count before disconnect (STA)

# === Security & Encryption ===
#   sw_enc=0           0:HW-encryption 1:SW-encryption 2:Hybrid

# === AMPDU / Performance ===
#   ampdu_mode=2       0:disabled 1:manual 2:auto
#   enable_short_bi=0  0:normal 1:short beacon interval
#   enable_legacy_ack=0  0:normal 1:legacy ACK mode
#   enable_beacon_bypass=0  0:normal 1:bypass beacons
#   support_ch_width=1 0:1/2MHz only 1:1/2/4MHz support

# === NDP / Probe ===
#   ndp_preq=0         0:legacy probe 1:NDP probe request (AP recommended)
#   ndp_ack_1m=0       0:2M NDP-ACK 1:1M NDP-ACK

# === CQM (Connection Quality Monitor) ===
#   disable_cqm=0      0:CQM-enabled 1:CQM-disabled
#   disable_cqm_on_scan=0  0:CQM active during scan 1:disabled during scan

# === CCA / RF Tuning ===
#   set_cca_threshold=-75  CCA threshold in dBm (default: -75)

# === TWT (Target Wake Time — 802.11ah) ===
#   twt_num=0          Number of TWT services (0=disabled)
#   twt_sp=0           TWT service period (usec)
#   twt_int=0          TWT wake interval (usec)
#   twt_force_sleep=0  Force sleep at end of TWT service (STA)
#   twt_num_in_group=1 Max STAs in a TWT group (AP)
#   twt_algo=0         TWT scheduling: 0=Balanced 1=FCFS (AP)

# === RAW (Restricted Access Window — AP only) ===
#   raw=0              0:disabled 1:enable RAW

# === Duty Cycle ===
#   set_duty_cycle=0,0,0   on/off, window, duration

# === Auth Control ===
#   set_auth_control=0,0,0,0,0  on/off, slot, ti_min, ti_max, scale

# === Recovery ===
#   recovery=0         0:monitor only 1:auto-restart on error threshold

# === Country / Band ===
#   kr_band=-1         Korea band selection: 1=USN1 2=USN5 (-1=auto)
#   sub_xtal_bypass=0  Sub-crystal oscillator bypass (0:off 1:on)

# === Firmware Update ===
#   auto_fw_update=0   0:disabled 1:auto firmware update
#   fw_update_name=    Firmware update filename (optional)
#   flash_fw=0         0:normal 1:fuse FW to sflash

# === MAC Address Override ===
#   macaddr=           Override MAC address (e.g., 00:11:22:33:44:55)

# === Monitor / Sniffer ===
#   enable_monitor=0   0:normal 1:enable monitor mode
#   enable_sched_scan=0  0:disabled 1:enable scheduled scan
#   signal_monitor=0   0:disabled 1:enable RSSI/SNR monitor

# === Debug ===
#   debug_level=2      0:ERR 1:WARN 2:INFO 3:DBG 4:VBS
#   debug_mask=0x201   Bitmask for debug categories
#   debug_level_all=0  0:per-module 1:apply debug_level to all modules
#   dbg_flow_control=0 0:off 1:print slot/credit status
#
# Debug mask categories (OR them together):
#   0x0001=BASIC  0x0002=HIF   0x0004=WIM    0x0008=TX
#   0x0010=RX     0x0020=MAC   0x0040=CAPI   0x0080=PS
#   0x0100=STATS  0x0200=STATE 0x0400=BD     0x0800=FW
#   0x1000=AMPDU  0x2000=CREDIT 0x4000=SLOT  0x8000=BUS
#   0xFFFF=ALL

# === Advanced / Test (not for production use) ===
#   nullfunc_enable=0    Enable null func on mac80211
#   discard_deauth=0     (Test) discard TX deauth
#   bitmap_encoding=1    (NRC7292) bitmap encoding for BA
#   reverse_scrambler=1  (NRC7292) reverse scrambler
#   loopback=0           HIF loopback test mode
#   lb_count=1           HIF loopback buffer count
#   wlantest=0           WLAN test mode
#   band_selection_gpio_num=-1     GPIO for band selection
#   band_selection_gpio_polarity=0 GPIO polarity for band
#
# ─────────────────────────────────────────────────────────────────────
# Quick Examples:
#
# [DEFAULT — AP mode] Already configured above:
#   options nrc_wlan fw_name=uni_s1g.bin bd_name=nrc7394_bd.dat \
#       ndp_preq=1 bss_max_idle=1800
#
# AP with RAW enabled:
#   options nrc_wlan fw_name=uni_s1g.bin bd_name=nrc7394_bd.dat \
#       ndp_preq=1 bss_max_idle=1800 raw=1
#
# STA (basic — no power save):
#   options nrc_wlan fw_name=uni_s1g.bin bd_name=nrc7394_bd.dat
#
# STA with Power Save (TIM):
#   options nrc_wlan fw_name=uni_s1g.bin bd_name=nrc7394_bd.dat \
#       power_save=2 listen_interval=1000 bss_max_idle=1800
#
# Debug all categories at DBG level:
#   options nrc_wlan fw_name=uni_s1g.bin bd_name=nrc7394_bd.dat \
#       debug_level=3 debug_mask=0xFFFF
